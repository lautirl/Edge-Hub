<!-- SCRIPT DE FIREBASE ADAPTADO EXCLUSIVAMENTE PARA LAUTI -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";
  import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
  import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDaa0202QD6WmSEOs6qqhWE0AMIFNr1feg",
    authDomain: "edhehub.firebaseapp.com",
    projectId: "edhehub",
    storageBucket: "edhehub.firebasestorage.app",
    messagingSenderId: "587481714783",
    appId: "1:587481714783:web:69153817ec93e198b58bea",
    measurementId: "G-PZEHMEDH1E"
  };

  const app = initializeApp(firebaseConfig);
  const analytics = getAnalytics(app);
  const db = getFirestore(app);
  const storage = getStorage(app);

  // 1. CUBRIR EL LOGIN: Controlar visibilidad del buzón según el usuario
  const originalLogin = window.login;
  window.login = function() {
    // Ejecuta la función de login que ya tenías
    if (typeof originalLogin === 'function') originalLogin();
    
    const user = (window.currentUser || "").trim().toLowerCase();
    const mailboxBtn = document.querySelector('.mailbox-btn');

    // Si el usuario NO es lauti, ocultamos el acceso al buzón privado
    if (user === "lauti") {
      if (mailboxBtn) mailboxBtn.style.display = "grid";
      escucharBuzonLauti(); // Activamos la recepción en tiempo real
    } else {
      if (mailboxBtn) mailboxBtn.style.display = "none";
    }
  };

  // 2. ENVIAR AL HUB (Cualquier usuario envía a Lauti)
  window.sendToHub = async function() {
    const commentInput = document.getElementById("hubComment");
    const fileInput = document.getElementById("hubImageInput");
    const btn = document.querySelector(".btn-send-hub");

    const comment = commentInput.value.trim();
    const file = fileInput.files[0];

    if (!comment && !file) {
      alert("Por favor, escribe un comentario o adjunta una imagen.");
      return;
    }

    btn.disabled = true;
    btn.innerText = "Enviando a Lauti... ⏳";

    try {
      let imageUrl = "";

      // Si subieron imagen, la guardamos en la carpeta hub_images
      if (file) {
        const storageRef = ref(storage, 'hub_images/' + Date.now() + '_' + file.name);
        await uploadBytes(storageRef, file);
        imageUrl = await getDownloadURL(storageRef);
      }

      // Guardamos el mensaje dirigido al buzón de Lauti
      await addDoc(collection(db, "buzon_lauti"), {
        sender: window.currentUser || "Usuario Anónimo",
        comment: comment,
        imageUrl: imageUrl,
        timestamp: new Date()
      });

      // Limpiar formulario
      commentInput.value = "";
      fileInput.value = "";
      const previewContainer = document.getElementById('previewContainer');
      if (previewContainer) previewContainer.style.display = 'none';

      alert("¡Imagen/Mensaje enviado con éxito al buzón de Lauti! 🚀");

    } catch (error) {
      console.error("Error al enviar: ", error);
      alert("Ocurrió un error al enviar. Revisa la consola.");
    } finally {
      btn.disabled = false;
      btn.innerText = "Enviar a Lauti 🚀";
    }
  };

  // 3. RECIBIR EN TIEMPO REAL (Exclusivo para Lauti)
  let unsubscribeBuzon = null;

  function escucharBuzonLauti() {
    // Evitamos duplicar escuchadores
    if (unsubscribeBuzon) return;

    const buzonRef = collection(db, "buzon_lauti");
    const q = query(buzonRef, orderBy("timestamp", "desc"));

    unsubscribeBuzon = onSnapshot(q, (snapshot) => {
      const inboxList = document.getElementById("inboxListDynamic");
      const badge = document.getElementById("mailBadge");
      
      if (!inboxList) return;
      inboxList.innerHTML = "";
      let count = 0;

      snapshot.forEach((docSnapshot) => {
        const data = docSnapshot.data();
        const docId = docSnapshot.id;
        count++;

        const dateStr = data.timestamp ? data.timestamp.toDate().toLocaleString() : "Recién";
        const imgHtml = data.imageUrl ? `<img src="${data.imageUrl}" class="inbox-img" alt="Captura de trade" style="margin-top:10px; border-radius:8px; max-width:100%;">` : "";

        inboxList.innerHTML += `
          <div class="inbox-item" style="background:#06080d; border:1px solid #182232; border-radius:12px; padding:14px; margin-bottom:12px;">
            <div class="inbox-header" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
              <div class="inbox-user" style="font-weight:800; color:var(--blue); font-size:13px;">De: ${data.sender}</div>
              <div style="display:flex; align-items:center; gap: 8px;">
                <span class="inbox-date" style="font-size:10px; color:var(--muted);">${dateStr}</span>
                <button onclick="deleteMessage('${docId}')" style="background:transparent; border:0; cursor:pointer;" title="Borrar">🗑️</button>
              </div>
            </div>
            <div class="inbox-comment" style="font-size:13px; color:#d1d5db;">${data.comment || ""}</div>
            ${imgHtml}
          </div>
        `;
      });

      // Actualizamos el contador solo en la pantalla de Lauti
      if (badge) {
        if (count > 0) {
          badge.style.display = "flex";
          badge.innerText = count;
        } else {
          badge.style.display = "none";
        }
      }
    });
  }

  // 4. FUNCIÓN PARA ELIMINAR MENSAJES DEL BUZÓN
  window.deleteMessage = async function(docId) {
    if (confirm("¿Estás seguro de eliminar este registro del buzón?")) {
      try {
        await deleteDoc(doc(db, "buzon_lauti", docId));
      } catch (error) {
        console.error("Error al eliminar: ", error);
      }
    }
  };
</script>
